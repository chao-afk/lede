name: Build LEDE XR30
on:
  workflow_dispatch:

env:
  CONFIG_FILE: xr30.config

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
          libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
          swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev

      - name: 执行前置脚本（添加QModem源）
        run: chmod +x diy-part1.sh && ./diy-part1.sh

      - name: 加载XR30配置
        run: |
          cp $CONFIG_FILE .config
          make defconfig

      - name: 构建并植入5G模组WebUI
        run: |
          # 安装Node.js构建环境
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt install -y nodejs
          npm install -g pnpm
          # 克隆WebUI源码
          git clone https://github.com/panasonic850218/Webui.git modem-webui
          cd modem-webui
          # 安装依赖并构建生产版本
          pnpm install
          pnpm build
          # 把构建好的页面复制到固件Web目录
          mkdir -p ../package/base-files/files/www/modem
          cp -rf dist/* ../package/base-files/files/www/modem/
          # 写入默认配置（路由器IP+AT服务端口）
          echo '{"status":"true","at":{"host":"192.168.1.1","port":8765}}' > ../package/base-files/files/www/modem/config.json

      - name: 执行后置脚本（开机配置）
        run: chmod +x diy-part2.sh && ./diy-part2.sh

      - name: 下载源码包
        run: make download -j8

      - name: 编译固件
        run: make V=s -j$(nproc)

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: lede-xr30-qmodem-webui
          path: bin/targets/mediatek/filogic/*.itb

