name: Build XR30 LEDE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf llvm git rsync

      - name: 执行自定义前置脚本
        run: |
          chmod +x ./diy.sh
          ./diy.sh

      - name: 加载配置
        run: |
          cp $CONFIG_FILE .config
          make defconfig
        env:
          CONFIG_FILE: xr30.config

      - name: 植入5G模组WebUI静态页面
        run: |
          git clone https://github.com/panasonic850218/Webui.git modem-webui
          mkdir -p ../package/base-files/files/www/modem
          cp -rf modem-webui/web/* ../package/base-files/files/www/modem/
          echo '{"status":"true","at":{"host":"192.168.1.1","port":8765}}' > ../package/base-files/files/www/modem/config.json

      - name: 执行后置自定义脚本
        run: |
          chmod +x ./diy-part2.sh
          ./diy-part2.sh

      - name: 开始编译固件
        run: make -j$(nproc) V=s

      - name: 列出产出固件文件（方便核对）
        run: ls -la bin/targets/mediatek/filogic/

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: lede-xr30-qmodem-webui
          path: bin/targets/mediatek/filogic/*.bin
